services:

  cloudflared:
    build:
      context: ../../src/cloudflared
    restart: unless-stopped
    env_file: .env
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yaml run --token $CLOUD_FLARE_TOKEN
    volumes:
      - ./config.yaml:/etc/cloudflared/config.yaml:ro
    depends_on:
      - thirtybees
    network_mode: host

  memcached:
    build:
      context: ../../src/memcached
    restart: unless-stopped

  mariadb:
    build:
      context: ../../src/db
    restart: unless-stopped
    env_file: .env

  thirtybees:
    build:
      context: ../../src/thirtybees
    ports:
      - "40080:80"
    depends_on:
      - mariadb
      - memcached
    restart: unless-stopped
    env_file: .env
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost" ]
      interval: 30s
      timeout: 10s
      retries: 5
