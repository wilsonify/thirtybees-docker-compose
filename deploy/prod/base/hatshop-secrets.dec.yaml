# HatShop Secrets - SOPS encrypted
# Encrypt with: sops encrypt --age age1mg4zlx7p736nnrp7glt7gyd96s33kmy8wlck903m0srkkndeaawqrqfzek --encrypted-regex "PASSWORD|EMAIL|TOKEN" hatshop-secrets.dec.yaml > hatshop-secrets.enc.yaml

apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: hatshop-secrets
  labels:
    app.kubernetes.io/name: hatshop
    app.kubernetes.io/instance: prod
    app.kubernetes.io/component: secrets
spec:
  secretTemplates:
    - name: hatshop-secrets
      labels:
        app.kubernetes.io/name: hatshop
        app.kubernetes.io/instance: prod
        app.kubernetes.io/component: secrets
      stringData:
        # Neon Database Password
        THIRTYBEES_DB_PASSWORD: "zai8aiKeePh1zaeYaiqu"
        # Admin Configuration (Chapter 7)
        THIRTYBEES_ADMIN_USERNAME: "hatshopadmin"
        THIRTYBEES_ADMIN_PASSWORD: "hatshopadmin"
        # PayPal Configuration (Chapter 6) - sensitive fields
        THIRTYBEES_PAYPAL_EMAIL: "your-production-seller@example.com"
        THIRTYBEES_PAYPAL_RETURN_URL: "https://hatshop.renewed-renaissance.com/prod/paypal_return.php"
        THIRTYBEES_PAYPAL_CANCEL_URL: "https://hatshop.renewed-renaissance.com/prod/paypal_cancel.php"
        THIRTYBEES_PAYPAL_IPN_URL: "https://hatshop.renewed-renaissance.com/prod/paypal_ipn.php"
