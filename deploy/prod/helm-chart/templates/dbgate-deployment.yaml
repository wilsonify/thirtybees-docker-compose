apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --file docker-compose.yml --chart
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: dbgate
  name: dbgate
spec:
  replicas: {{ .Values.dbgate.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: dbgate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --file docker-compose.yml --chart
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: dbgate
    spec:
      automountServiceAccountToken: false
      containers:
        - image: {{ .Values.dbgate.image }}
          name: dbgate
          ports:
            - containerPort: {{ .Values.dbgate.port }}
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 512Mi
      restartPolicy: Always
