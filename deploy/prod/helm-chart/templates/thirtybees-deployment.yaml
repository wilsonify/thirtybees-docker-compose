apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --file docker-compose.yml --chart
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: thirtybees
  name: thirtybees
spec:
  replicas: {{ .Values.thirtybees.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: thirtybees
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --file docker-compose.yml --chart
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: thirtybees
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-credentials
                  key: password
            - name: MARIADB_USER
              value: {{ .Values.mariadb.mariadbUser }}
          image: {{ .Values.thirtybees.image }}
          livenessProbe:
            exec:
              command:
                - curl -f http://localhost
            failureThreshold: 5
            periodSeconds: 30
            timeoutSeconds: 10
          name: thirtybees
          ports:
            - containerPort: {{ .Values.thirtybees.port }}
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              memory: 1Gi
      restartPolicy: Always
