apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert --file docker-compose.yml --chart
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: memcached
  name: memcached
spec:
  replicas: {{ .Values.memcached.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: memcached
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert --file docker-compose.yml --chart
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: memcached
    spec:
      automountServiceAccountToken: false
      containers:
        - image: {{ .Values.memcached.image }}
          name: memcached
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 256Mi
      restartPolicy: Always
